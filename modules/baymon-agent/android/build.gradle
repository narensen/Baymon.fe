plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.baymonagent'
version = '1.0.0'

android {
  namespace "expo.modules.baymonagent"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // On-device wake word ("Hey Baymon"); audio never leaves the phone.
  implementation 'ai.picovoice:porcupine-android:4.0.2'
}
